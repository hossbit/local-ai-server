name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run ShellCheck
        run: |
          shellcheck -x \
            localai install.sh install-local-ai.sh start.sh stop.sh \
            rebuild-config.sh uninstall-local-ai.sh update-local-ai.sh \
            lib/*.sh lib/cli/*.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bash syntax check
        run: |
          bash -n \
            localai install.sh install-local-ai.sh start.sh stop.sh \
            rebuild-config.sh uninstall-local-ai.sh update-local-ai.sh \
            lib/*.sh lib/cli/*.sh

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats tests
